<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Student | SPMS</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f7fb;
        }

        .navbar {
            background: #172554;
            color: white;
            padding: 18px 40px;

            display: flex;
            justify-content: space-between;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 15px;

            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h1 {
            color: #172554;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #475569;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;

            border: 1px solid #cbd5e1;
            border-radius: 8px;

            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        .checkbox {
            width: auto;
            margin-right: 8px;
        }

        .buttons {
            margin-top: 25px;
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        .save {
            background: #2563eb;
            color: white;
        }

        .back {
            background: #e2e8f0;
            color: #172554;
        }

    </style>
</head>

<body>

    <div class="navbar">

        <strong>SPMS</strong>

        <div>
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'students' %}">Students</a>
            <a href="{% url 'companies' %}">Companies</a>
            <a href="{% url 'placements' %}">Placements</a>
        </div>

    </div>


    <div class="container">

        <div class="card">

            <h1>✏️ Edit Student</h1>

            <form method="POST">

                {% csrf_token %}

                <div class="form-group">

                    <label>Name</label>

                    <input
                        type="text"
                        name="name"
                        value="{{ student.name }}"
                        required>

                </div>


                <div class="form-group">

                    <label>Email</label>

                    <input
                        type="email"
                        name="email"
                        value="{{ student.email }}"
                        required>

                </div>


                <div class="form-group">

                    <label>Phone</label>

                    <input
                        type="text"
                        name="phone"
                        value="{{ student.phone }}">

                </div>


                <div class="form-group">

                    <label>Department</label>

                    <input
                        type="text"
                        name="department"
                        value="{{ student.department }}">

                </div>


                <div class="form-group">

                    <label>CGPA</label>

                    <input
                        type="text"
                        name="cgpa"
                        value="{{ student.cgpa }}">

                </div>


                <div class="form-group">

                    <label>Skills</label>

                    <input
                        type="text"
                        name="skills"
                        value="{{ student.skills }}">

                </div>


                <div class="form-group">

                    <label>

                        <input
                            type="checkbox"
                            class="checkbox"
                            name="placed"
                            {% if student.placed %}checked{% endif %}>

                        Placed

                    </label>

                </div>


                <div class="buttons">

                    <button
                        type="submit"
                        class="btn save">
                        💾 Save Changes
                    </button>

                    <a
                        href="{% url 'students' %}"
                        class="btn back">
                        ← Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</body>

</html>
