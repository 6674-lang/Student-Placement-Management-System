<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Company | SPMS</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f7fb;
        }

        .navbar {
            background: #172554;
            color: white;
            padding: 18px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        .container {
            max-width: 750px;
            margin: 45px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 16px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .title {
            margin-bottom: 25px;
        }

        .title h1 {
            color: #172554;
            margin-bottom: 8px;
        }

        .title p {
            color: #64748b;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;

            color: #334155;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px 15px;

            border: 1px solid #cbd5e1;
            border-radius: 8px;

            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        button,
        .back-btn {
            padding: 12px 20px;
            border-radius: 8px;

            font-size: 15px;
            font-weight: bold;

            text-decoration: none;
            cursor: pointer;
        }

        button {
            border: none;
            background: #2563eb;
            color: white;
        }

        button:hover {
            background: #1d4ed8;
        }

        .back-btn {
            background: #e2e8f0;
            color: #172554;
        }

        @media (max-width: 600px) {

            .navbar {
                padding: 18px;
            }

            .navbar a {
                margin-left: 10px;
                font-size: 13px;
            }

            .container {
                margin-top: 20px;
            }

            .card {
                padding: 25px;
            }

            .buttons {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>

    <!-- NAVBAR -->

    <div class="navbar">

        <div class="logo">
            SPMS
        </div>

        <div>

            <a href="{% url 'home' %}">
                Home
            </a>

            <a href="{% url 'students' %}">
                Students
            </a>

            <a href="{% url 'companies' %}">
                Companies
            </a>

            <a href="{% url 'placements' %}">
                Placements
            </a>

        </div>

    </div>


    <!-- FORM -->

    <div class="container">

        <div class="card">

            <div class="title">

                <h1>
                    🏢 Add New Company
                </h1>

                <p>
                    Enter company and job opportunity details.
                </p>

            </div>


            <form method="POST">

                {% csrf_token %}


                <div class="form-group">

                    <label>
                        Company Name
                    </label>

                    <input
                        type="text"
                        name="name"
                        placeholder="Enter company name"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Location
                    </label>

                    <input
                        type="text"
                        name="location"
                        placeholder="Enter company location"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Job Role
                    </label>

                    <input
                        type="text"
                        name="role"
                        placeholder="Example: Python Developer"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Package
                    </label>

                    <input
                        type="text"
                        name="package"
                        placeholder="Example: 5 LPA"
                        required>

                </div>


                <div class="buttons">

                    <button type="submit">
                        💾 Add Company
                    </button>

                    <a
                        href="{% url 'companies' %}"
                        class="back-btn">
                        ← Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</body>

</html>
