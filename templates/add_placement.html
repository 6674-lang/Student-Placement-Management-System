<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Placement | SPMS</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            min-height: 100vh;
        }

        /* NAVBAR */

        .navbar {
            background: #172554;
            color: white;
            padding: 18px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            font-size: 15px;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }

        /* CONTAINER */

        .container {
            max-width: 750px;
            margin: 45px auto;
            padding: 20px;
        }

        /* CARD */

        .card {
            background: white;
            padding: 35px;

            border-radius: 16px;

            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #172554;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 30px;
        }

        /* FORM */

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;

            color: #334155;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;

            padding: 13px 15px;

            border: 1px solid #cbd5e1;
            border-radius: 8px;

            font-size: 15px;

            background: white;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #2563eb;
        }

        /* BUTTONS */

        .buttons {
            display: flex;
            gap: 12px;

            margin-top: 30px;
        }

        button,
        .cancel-btn {
            padding: 12px 22px;

            border-radius: 8px;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
            text-decoration: none;
        }

        button {
            border: none;

            background: #2563eb;
            color: white;
        }

        button:hover {
            background: #1d4ed8;
        }

        .cancel-btn {
            background: #e2e8f0;
            color: #172554;
        }

        .cancel-btn:hover {
            background: #cbd5e1;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            .navbar {
                padding: 18px;
            }

            .nav-links a {
                margin-left: 8px;
                font-size: 12px;
            }

            .container {
                margin: 25px auto;
            }

            .card {
                padding: 25px;
            }

            .buttons {
                flex-direction: column;
            }

        }

    </style>

</head>

<body>

    <!-- NAVBAR -->

    <div class="navbar">

        <div class="logo">
            SPMS
        </div>

        <div class="nav-links">

            <a href="{% url 'home' %}">
                Home
            </a>

            <a href="{% url 'students' %}">
                Students
            </a>

            <a href="{% url 'companies' %}">
                Companies
            </a>

            <a href="{% url 'placements' %}">
                Placements
            </a>

        </div>

    </div>


    <!-- MAIN -->

    <div class="container">

        <div class="card">

            <h1>
                🎓 Add Placement
            </h1>

            <p class="subtitle">
                Create a new student placement record.
            </p>


            <form method="POST">

                {% csrf_token %}


                <!-- STUDENT -->

                <div class="form-group">

                    <label>
                        Select Student
                    </label>

                    <select name="student" required>

                        <option value="">
                            -- Select Student --
                        </option>

                        {% for student in students %}

                        <option value="{{ student.id }}">
                            {{ student.name }}
                        </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- COMPANY -->

                <div class="form-group">

                    <label>
                        Select Company
                    </label>

                    <select name="company" required>

                        <option value="">
                            -- Select Company --
                        </option>

                        {% for company in companies %}

                        <option value="{{ company.id }}">
                            {{ company.name }}
                        </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- JOB ROLE -->

                <div class="form-group">

                    <label>
                        Job Role
                    </label>

                    <input
                        type="text"
                        name="job_role"
                        placeholder="Example: Software Developer"
                        required>

                </div>


                <!-- PACKAGE -->

                <div class="form-group">

                    <label>
                        Package
                    </label>

                    <input
                        type="text"
                        name="package"
                        placeholder="Example: 5 LPA"
                        required>

                </div>


                <!-- DATE -->

                <div class="form-group">

                    <label>
                        Placement Date
                    </label>

                    <input
                        type="date"
                        name="placement_date">

                </div>


                <!-- BUTTONS -->

                <div class="buttons">

                    <button type="submit">
                        💾 Save Placement
                    </button>

                    <a
                        href="{% url 'placements' %}"
                        class="cancel-btn">

                        ← Cancel

                    </a>

                </div>

            </form>

        </div>

    </div>

</body>

</html>
