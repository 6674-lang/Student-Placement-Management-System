<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Company | SPMS</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #1e293b;
        }

        .container {
            max-width: 750px;
            margin: 40px auto;
            padding: 20px;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .form-card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
        }

        .header {
            margin-bottom: 30px;
        }

        .header h1 {
            margin-bottom: 8px;
        }

        .header p {
            color: #64748b;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        .save-btn {
            border: none;
            background: #2563eb;
            color: white;
            padding: 13px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .save-btn:hover {
            background: #1d4ed8;
        }

        .cancel-btn {
            background: #e5e7eb;
            color: #334155;
            padding: 13px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        .cancel-btn:hover {
            background: #d1d5db;
        }

        @media (max-width: 600px) {
            .container {
                margin: 20px auto;
            }

            .form-card {
                padding: 25px;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <a href="{% url 'companies' %}" class="back">
        ← Back to Companies
    </a>

    <div class="form-card">

        <div class="header">
            <h1>Edit Company</h1>
            <p>Update company information and job details.</p>
        </div>

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">
                <label>Company Name</label>

                <input
                    type="text"
                    name="name"
                    value="{{ company.name }}"
                    required>
            </div>

            <div class="form-group">
                <label>Location</label>

                <input
                    type="text"
                    name="location"
                    value="{{ company.location }}">
            </div>

            <div class="form-group">
                <label>Job Role</label>

                <input
                    type="text"
                    name="role"
                    value="{{ company.role }}">
            </div>

            <div class="form-group">
                <label>Package</label>

                <input
                    type="text"
                    name="package"
                    value="{{ company.package }}">
            </div>

            <div class="buttons">

                <button type="submit" class="save-btn">
                    Save Changes
                </button>

                <a
                    href="{% url 'companies' %}"
                    class="cancel-btn">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
